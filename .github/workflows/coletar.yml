# Coleta os precos nos marketplaces e publica o site.
#
# Roda nos servidores do GitHub, que tem internet liberada. E o que permite
# abrir a tabela por um endereco normal, sem instalar nada no computador.
#
# Para rodar na hora: aba Actions -> "Coletar precos e publicar" -> Run workflow.

name: Coletar precos e publicar

on:
  workflow_dispatch:
    inputs:
      uf:
        description: 'Estado (sigla minuscula, ex: sp)'
        required: false
        default: 'sp'
      regiao:
        description: 'Regiao na OLX (ex: sao-paulo-e-regiao). Vazio = estado inteiro'
        required: false
        default: 'sao-paulo-e-regiao'
      cidade:
        description: 'Sua cidade'
        required: false
        default: 'Sao Paulo'
      categoria:
        description: 'Coletar so uma categoria (vazio = catalogo inteiro)'
        required: false
        default: ''
  schedule:
    # 09:00 UTC = 06:00 no horario de Brasilia.
    - cron: '0 9 * * *'
  # workflow_dispatch e schedule so valem na branch principal. O gatilho de
  # push roda na propria branch, o que permite testar a coleta antes do merge.
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/coletar.yml'
      - 'src/**'
      - 'bin/**'
      - 'public/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      UF: ${{ github.event.inputs.uf || vars.UF || 'sp' }}
      REGIAO: ${{ github.event.inputs.regiao || vars.REGIAO || 'sao-paulo-e-regiao' }}
      CIDADE: ${{ github.event.inputs.cidade || vars.CIDADE || 'Sao Paulo' }}
      FONTE_OLX: 'true'
      FONTE_ENJOEI: 'true'
      # O Marketplace exige login: nao da para rodar aqui.
      FONTE_FACEBOOK: 'false'
      SOMENTE_PESSOA_FISICA: 'true'
      MAX_PAGINAS: '2'
      DELAY_MS: '2500'
      USAR_NAVEGADOR: 'true'
      HEADLESS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Conferir a matematica
        run: npm run selftest

      - name: Diagnostico das fontes
        continue-on-error: true
        run: |
          npm run doctor -- "iphone 13" 2>&1 | tee diagnostico.txt
          {
            echo '## Diagnostico das fontes'
            echo ''
            echo '```'
            cat diagnostico.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: O que a OLX devolve para esta maquina
        continue-on-error: true
        run: |
          node bin/inspecionar-olx.js 2>&1 | tee inspecao.txt
          {
            echo '## O que a OLX devolve para o servidor'
            echo ''
            echo '```'
            cat inspecao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coletar precos
        # Uma fonte fora do ar nao pode derrubar a publicacao: o site sai
        # com o que deu certo e avisa na tela o que falhou.
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.categoria }}" ]; then
            npm run atualizar -- "${{ github.event.inputs.categoria }}"
          else
            npm run atualizar
          fi

      - name: Gerar o site
        run: node bin/gerar-site.js | tee resumo-coleta.txt

      - name: Resumo visivel na aba Actions
        if: always()
        run: |
          {
            echo '## Resultado da coleta'
            echo ''
            echo '```'
            cat resumo-coleta.txt 2>/dev/null || echo 'sem resumo'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os precos no repositorio
        # Os snapshots ficam versionados: assim o site pode ser regerado sem
        # coletar de novo, e da para acompanhar o preco mudando com o tempo.
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/snapshots data/historico.json resumo-coleta.txt inspecao.txt diagnostico.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo 'Nada mudou nos precos.'
          else
            git commit -m "Precos coletados em $(date -u '+%Y-%m-%d %H:%M UTC')

          Gerado automaticamente pela coleta que roda nos servidores do GitHub."
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Guardar os dados coletados
        uses: actions/upload-artifact@v4
        with:
          name: dados-coletados
          path: data/
          retention-days: 30

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
