<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b6b58"><meta name="description" content="Gestão completa da loja: vendas, caixa, estoque, financeiro e 52 indicadores."><title>Caixa Claro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230b6b58%22/%3E%3Cpath d=%22M44 22a14 14 0 1 0 0 20%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
</head><body>
<style>[hidden]{display:none!important}
/* Layout: trilho lateral fixo (desktop) + área de trabalho rolável; no celular, gaveta + barra inferior.
   O DRE aparece como um cupom de caixa — o único elemento "decorado" do sistema. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --sunken:#e6ebe8;
  --ink:#101614; --ink-2:#44504b; --muted:#6f7a75; --line:#dfe5e2; --line-2:#c6cfcb;
  --accent:#0b6b58; --accent-2:#0a5a4a; --accent-ink:#ffffff; --accent-soft:#dcefe9; --accent-line:#a8d3c7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s1-wash:rgba(42,120,214,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#e4f3e4; --warn-soft:#fcf0d4; --serious-soft:#fbe8df; --crit-soft:#f9e3e3; --info-soft:#e3ecf8;
  --pos:#006300; --neg:#b3261e;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 6px 20px rgba(16,24,20,.06);
  --shadow-lg:0 10px 40px rgba(10,20,16,.22);
  --overlay:rgba(8,14,12,.45);
  --r:12px; --r-sm:8px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:252px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f0e; --surface:#131917; --surface-2:#18201d; --sunken:#1d2522; --ink:#e8eeeb; --ink-2:#b3beb9; --muted:#87928d; --line:#232c29; --line-2:#33403b;
  --accent:#3fc2a6; --accent-2:#5dd3b9; --accent-ink:#04201a; --accent-soft:#12302a; --accent-line:#245a4e;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s1-wash:rgba(57,135,229,.14);
  --good-soft:#132a15; --warn-soft:#2e2510; --serious-soft:#2f1d15; --crit-soft:#321617; --info-soft:#14223a;
  --pos:#3ccf5a; --neg:#f08a84; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0f0e; --surface:#131917; --surface-2:#18201d; --sunken:#1d2522; --ink:#e8eeeb; --ink-2:#b3beb9; --muted:#87928d; --line:#232c29; --line-2:#33403b;
  --accent:#3fc2a6; --accent-2:#5dd3b9; --accent-ink:#04201a; --accent-soft:#12302a; --accent-line:#245a4e;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s1-wash:rgba(57,135,229,.14);
  --good-soft:#132a15; --warn-soft:#2e2510; --serious-soft:#2f1d15; --crit-soft:#321617; --info-soft:#14223a;
  --pos:#3ccf5a; --neg:#f08a84; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:700;line-height:1.15}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:.98rem;font-weight:650}
p{margin:0}
small{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.92em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.sp{flex:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.brand-t{min-width:0}
.brand-t b{display:block;font-family:var(--f-display);font-size:1.02rem;letter-spacing:-.01em;line-height:1.1}
.brand-t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin:0 12px 8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);display:flex;align-items:center;gap:10px;border:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who-t{min-width:0;flex:1}
.who-t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-t span{font-size:11.5px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:thin}
.nav-g{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav a .n{margin-left:auto;font-size:11px;font-family:var(--f-mono);color:var(--muted);min-width:18px;text-align:right}
.nav a.on .n{color:var(--accent)}
.side-foot{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top-t{min-width:0;flex:1;display:flex;align-items:center;gap:10px}
.top-t b{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .menu-btn{display:none}
.view{flex:1;width:100%;max-width:1320px;padding-block:22px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
.drawer-ovl{display:none}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ghost.danger{color:var(--neg);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.lg{height:48px;padding:0 20px;font-size:15.5px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.per-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;max-width:100%}
.per-btn span{color:var(--muted);font-weight:500;white-space:nowrap}
.per-btn:hover{border-color:var(--muted)}

/* ---------- cabeçalho de página ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.ph>div:first-child{min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ph p{color:var(--ink-2);margin-top:4px;max-width:68ch}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.banner p{flex:1;min-width:220px}

/* ---------- cartões, KPIs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{flex:1;min-width:0}
.card-h .sub{font-size:12.5px;color:var(--muted);width:100%;margin-top:-6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g-wide{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.kpi-h{display:flex;align-items:flex-start;gap:6px}
.kpi-l{font-size:12.5px;font-weight:600;color:var(--ink-2);flex:1;line-height:1.3}
.kpi-v{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi .delta{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.kpi.hl{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.kpi.alert{border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.qi{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;display:grid;place-items:center;flex:none;padding:0;line-height:1}
.qi:hover{color:var(--accent);border-color:var(--accent)}

.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.hero-main{padding:20px;display:flex;flex-direction:column}
.mini{margin-top:auto;padding-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--line)}
.mini div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mini span{font-size:12px;color:var(--muted)}
.mini b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.mini small{font-size:12px}
.hero-l{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.hero-v{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:6px 0 4px}
.meter{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin:14px 0 8px}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--accent);max-width:100%}
.meter.good>i{background:var(--good)} .meter.warn>i{background:var(--warn)} .meter.crit>i{background:var(--crit)}
.meter-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.month-sw{display:flex;align-items:center;gap:4px}
.month-sw b{font-family:var(--f-display);font-size:1rem;min-width:150px;text-align:center}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.chip.good{background:var(--good-soft);color:var(--ink)} .chip.good::before{background:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--ink)} .chip.warn::before{background:var(--warn)}
.chip.serious{background:var(--serious-soft);color:var(--ink)} .chip.serious::before{background:var(--serious)}
.chip.crit{background:var(--crit-soft);color:var(--ink)} .chip.crit::before{background:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--ink)} .chip.info::before{background:var(--s1)}
.chip.plain::before{display:none}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--sunken);font-size:11.5px;font-weight:600;color:var(--ink-2)}

/* ---------- alertas ---------- */
.alerts{display:flex;flex-direction:column;gap:2px}
.al{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;text-decoration:none;color:var(--ink);cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.al:hover{background:var(--surface-2)}
.al .sev{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--sunken)}
.al .sev svg{width:15px;height:15px}
.al.crit .sev{background:var(--crit-soft);color:var(--crit)} .al.warn .sev{background:var(--warn-soft);color:#9a6a00} .al.info .sev{background:var(--info-soft);color:var(--s1)} .al.good .sev{background:var(--good-soft);color:var(--good)}
.al span{flex:1;font-size:14px}
.al b{font-weight:650}

/* ---------- abas ---------- */
.tabs{display:flex;gap:4px;padding:4px;background:var(--sunken);border-radius:11px;overflow-x:auto;scrollbar-width:none;max-width:100%;align-self:flex-start}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips-f{display:flex;gap:6px;flex-wrap:wrap}
.chips-f button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chips-f button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* ---------- tabelas ---------- */
.tbl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:36px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px 0 34px}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{text-align:left;font-size:12px;font-weight:650;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.rt th.sortable{cursor:pointer}
.rt th.sortable:hover{color:var(--ink)}
.rt th .ar{font-size:10px;margin-left:3px}
.rt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt tbody tr.click{cursor:pointer}
.rt tbody tr.click:hover td{background:var(--surface-2)}
.rt td.main b{font-weight:600}
.rt td.main small{display:block}
.tbl-more{display:flex;justify-content:center;padding-top:10px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-size:15px}

/* ---------- barras horizontais ---------- */
.hb{display:flex;flex-direction:column;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb-t{height:10px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hb-f{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.hb-v small{font-weight:500;margin-left:4px}

/* ---------- gráficos ---------- */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.dash{stroke-dasharray:5 4}
.chart .ar{stroke:none}
.chart .xh{stroke:var(--muted);stroke-width:1}
.chart .band{fill:var(--ink);opacity:.05}
.chart .dt{stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;background:var(--c)}
.legend i.bk{width:10px;height:10px;border-radius:3px}
.legend i.lk{width:14px;height:2px;border-radius:2px}
.legend i.lk.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:9px;padding:8px 10px;font-size:12.5px;min-width:130px;max-width:260px}
#tip .tt{color:var(--muted);font-size:11.5px;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px;padding:1px 0}
#tip .tr i{width:12px;height:2px;border-radius:2px;flex:none}
#tip .tr b{font-variant-numeric:tabular-nums}
#tip .tr span{color:var(--ink-2)}

/* ---------- cupom (DRE) ---------- */
.receipt{position:relative;font-family:var(--f-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;padding:18px 18px 22px;margin-bottom:8px}
.receipt::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-8px;height:8px;background:radial-gradient(circle at 5px 8px,transparent 4.6px,var(--surface) 5px) 0 0/10px 8px repeat-x}
.receipt .rh{text-align:center;text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:12px;margin-bottom:2px}
.receipt .rs{text-align:center;color:var(--muted);font-size:11.5px;margin-bottom:12px}
.receipt hr{border:0;border-top:1px dashed var(--line-2);margin:8px 0}
.rl{display:flex;align-items:baseline;gap:6px;padding:2px 0}
.rl .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rl .lead{flex:1;border-bottom:1px dotted var(--line-2);min-width:12px;transform:translateY(-3px)}
.rl .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.rl.sub .k{padding-left:12px;color:var(--ink-2)}
.rl.tot{font-weight:700;font-size:13.5px}
.rl.tot .v{font-size:14px}

/* ---------- módulos ---------- */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0;transition:border-color .12s,transform .12s}
.mod:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.mod-h{display:flex;align-items:center;gap:10px}
.mod-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mod-n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mod h3{font-size:1rem}
.mod-v{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.mod-s{font-size:12.5px;color:var(--muted);margin-top:-6px}

/* ---------- PDV ---------- */
.pdv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,1fr);gap:16px;align-items:start}
.pdv-cart{position:sticky;top:76px}
.pdv-search{position:relative}
.pdv-search input{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 14px 0 44px;font-size:16px}
.pdv-search input:focus{border-color:var(--accent);outline:0}
.pdv-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.prod{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.prod:hover{border-color:var(--accent)}
.prod b{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pr{font-weight:700;font-size:14.5px}
.prod small{font-size:11.5px}
.prod.out{opacity:.55}
.cart-items{display:flex;flex-direction:column;gap:0;margin:-4px 0 8px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci-n{font-weight:600;font-size:14px;min-width:0}
.ci-n small{display:block;font-weight:500}
.ci-t{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ci-c{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;height:32px}
.qty button{width:32px;height:32px;border:0;background:var(--surface-2);cursor:pointer;font-size:16px;font-weight:700;color:var(--ink)}
.qty input{width:44px;height:32px;border:0;text-align:center;background:var(--surface);font-weight:600}
.ci-c .pin{width:96px;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;background:var(--surface);font-size:13.5px}
.tot-lines{display:flex;flex-direction:column;gap:4px;font-size:14px;padding:10px 0}
.tot-lines div{display:flex;justify-content:space-between;gap:10px}
.tot-lines .big{font-size:1.4rem;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.pay{display:flex;flex-wrap:wrap;gap:6px}
.pay label{position:relative}
.pay input{position:absolute;opacity:0;pointer-events:none}
.pay span{display:inline-block;padding:7px 12px;border-radius:9px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface)}
.pay input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pay input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pdv-bar{display:none}
.sel-cust{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:10px;cursor:pointer;background:transparent;width:100%;text-align:left}
.sel-cust:hover{border-color:var(--accent)}
.sel-cust.has{border-style:solid;background:var(--surface-2)}
.sel-cust span{flex:1;min-width:0}
.sel-cust small{display:block}

/* ---------- formulários ---------- */
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{grid-column:auto}
.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld .req{color:var(--neg);font-weight:700}
.fld small{font-size:12px;line-height:1.35}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea,.inp{width:100%;min-height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);padding:8px 11px;font-size:15px}
.fld textarea{resize:vertical;min-height:70px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.err input,.fld.err select{border-color:var(--crit)}
.inp-pre{position:relative;display:flex}
.inp-pre span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.inp-pre input{padding-left:36px!important}
.inp-suf{position:relative;display:flex}
.inp-suf span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.inp-suf input{padding-right:30px!important}
.fld.chk{flex-direction:column}
.ck{display:flex!important;align-items:center;gap:9px;font-weight:500!important;color:var(--ink)!important;cursor:pointer;font-size:14.5px!important}
.ck input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 13px;border-radius:9px;border:1px solid var(--line-2);font-size:14px;font-weight:600;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.stars{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.stars input{position:absolute;opacity:0;pointer-events:none}
.stars label{cursor:pointer;color:var(--line-2);font-size:30px;line-height:1}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#e9a400}
.stars input:focus-visible+label{outline:2px solid var(--accent);border-radius:4px}
.stv{color:#d99a00;letter-spacing:1px;white-space:nowrap}
.frm-sep{grid-column:1/-1;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.frm-html,.frm-live{grid-column:1/-1}
.frm-live:empty,.frm-err:empty{display:none}
.frm-err{grid-column:1/-1;background:var(--crit-soft);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:500}
.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.preview div{display:flex;flex-direction:column;gap:2px;min-width:0}
.preview span{font-size:12px;color:var(--muted)}
.preview b{font-size:15px;font-variant-numeric:tabular-nums}
.lines{display:flex;flex-direction:column;gap:8px}
.line-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 110px 34px;gap:6px;align-items:center}
.line-row select,.line-row input{min-height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:6px 8px;font-size:14px;width:100%;min-width:0}
.line-h{display:grid;grid-template-columns:minmax(0,1fr) 78px 110px 34px;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .14s ease-out}
.mdl{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:min(88vh,860px);display:flex;flex-direction:column;animation:pop .16s ease-out}
.mdl.sm{max-width:420px} .mdl.lg{max-width:780px} .mdl.xl{max-width:980px}
.mdl-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.mdl-h h2{flex:1;font-size:1.12rem}
.mdl-b{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.mdl-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.per-list{display:flex;flex-direction:column;gap:2px}
.per-list button{display:flex;align-items:center;gap:10px;padding:10px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:left;font-size:14.5px}
.per-list button:hover{background:var(--surface-2)}
.per-list button .ck2{width:16px;color:var(--accent);font-weight:800}
.per-list button span{flex:1}
.per-list button small{font-size:12px}
.per-custom{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin-bottom:12px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
.info-f{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:10px 0;line-height:1.5}
.info-b p+p{margin-top:8px}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:pop .18s ease-out;pointer-events:auto}
.toast.err{background:var(--crit);color:#fff}

/* ---------- login / boas-vindas ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.gate-box h1{font-size:1.5rem;margin:14px 0 4px}
.gate-box>p{color:var(--ink-2);margin-bottom:18px}
.users{display:flex;flex-direction:column;gap:8px}
.users button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.users button:hover{border-color:var(--accent)}
.users button span{flex:1}
.users button small{display:block}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pinpad button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;cursor:pointer}
.pinpad button:hover{border-color:var(--accent)}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:16px 0 4px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:st}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--accent-line)}
.step .nb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--muted)}
.step.done .nb{background:var(--good);border-color:var(--good);color:#fff}
.step span{flex:1;font-size:14px}
.step span small{display:block}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col h3 .tag{margin-left:auto}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.oc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oc-h b{flex:1;min-width:0}
.oc p{font-size:13px;color:var(--ink-2)}
.oc-a{display:flex;gap:6px;flex-wrap:wrap}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:600;list-style-position:outside}
.faq details p{margin-top:8px;color:var(--ink-2);max-width:72ch}
.gl{display:flex;flex-direction:column;gap:2px}
.gl-i{padding:10px 0;border-bottom:1px solid var(--line)}
.gl-i b{display:block}
.gl-i .info-f{margin:6px 0}
.gl-i p{color:var(--ink-2);font-size:14px;max-width:80ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.ctx{display:flex;flex-wrap:wrap;gap:8px}
.ctx span{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px}
.ctx b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.code-box{font-family:var(--f-mono);font-size:20px;letter-spacing:.18em;font-weight:700;text-align:center;padding:12px;border:1px dashed var(--line-2);border-radius:10px;background:var(--surface-2);margin:8px 0;user-select:all}
textarea.raw{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);padding:10px}

/* ---------- responsivo ---------- */
@media (max-width:1180px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .drawer-open .side{transform:none}
  .drawer-open .drawer-ovl{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:54px}
  .top .menu-btn{display:grid}
  .top .hide-m{display:none}
  .view{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;border:0;background:transparent;cursor:pointer}
  .tabbar .on{color:var(--accent)}
  .tabbar .ic{width:22px;height:22px}
  .tabbar .sale{color:var(--accent)}
  .tabbar .sale .ic{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--accent);color:var(--accent-ink);margin-top:-4px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .pdv{grid-template-columns:minmax(0,1fr)}
  .pdv-cart{position:static}
  .pdv-bar{display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--surface);border-top:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pdv-bar b{font-size:1.15rem}
  .pdv-bar .sp{min-width:0}
  .view.has-bar{padding-bottom:calc(168px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  h1{font-size:1.4rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpis.odd>.kpi:first-child{grid-column:1/-1}
  .kpi{padding:12px}
  .kpi-v{font-size:1.25rem}
  .card{padding:14px}
  .tbl-wrap{margin:0;padding:0;overflow:visible}
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{padding:10px 0;border-bottom:1px solid var(--line)}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.rt td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left;flex:none;max-width:45%}
  table.rt td.main{display:block;text-align:left;padding-bottom:4px}
  table.rt td.main::before{display:none}
  table.rt td.num{text-align:right}
  table.rt td:empty{display:none}
  .rt tbody tr.click:hover td{background:transparent}
  .ovl{padding:0;align-items:flex-end}
  .mdl,.mdl.sm,.mdl.lg,.mdl.xl{max-width:none;border-radius:18px 18px 0 0;max-height:94vh;max-height:94dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .mdl-h{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mdl-b,.mdl-f{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .board{grid-template-columns:minmax(0,1fr)}
  .hb-row{grid-template-columns:minmax(80px,38%) minmax(0,1fr) auto}
  .line-row,.line-h{grid-template-columns:minmax(0,1fr) 62px 92px 30px}
  .per-custom{grid-template-columns:1fr 1fr}
  .per-custom .btn{grid-column:1/-1}
  .month-sw b{min-width:0;font-size:.95rem}
  .frm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mods>.mod:first-child{grid-column:1/-1}
  .mod{padding:12px;gap:8px}
  .mod-ic{width:30px;height:30px}

  S.moves.push({ id: uid(), date: date || nowS(), productId, qty, type, refId: refId || null, unitCost: cost ?? unitCost(p), note: note || '', user: currentUser()?.name || 'Sistema' });
}
const openCash = () => S.cash.find(c => !c.closedAt) || null;

// ---------- vendas ----------
function saveSale(d, opt = {}) {
  const cfg = S.config, I = ix();
  const pm = I.pm.get(d.paymentMethodId) || cfg.paymentMethods[0];
  const items = d.items.filter(it => +it.qty > 0).map(it => {
    const p = I.prod.get(it.productId);
    return { productId: it.productId, name: p ? p.name : it.name || 'Item', sku: p ? p.sku || '' : '', qty: +it.qty, price: r2(it.price), cost: p ? unitCost(p) : r2(it.cost || 0), discount: r2(it.discount || 0) };
  });
  const subtotal = r2(sum(items, i => i.qty * i.price - i.discount));
  const ful = d.fulfillment && d.fulfillment.type && d.fulfillment.type !== 'balcao' ? d.fulfillment : null;
  const shipCharged = r2(ful ? ful.shippingCharged || 0 : 0);
  const discount = r2(clamp(d.discount || 0, 0, subtotal));
  const goods = r2(subtotal - discount);
  const total = r2(goods + shipCharged);
  const fee = r2(total * (+pm.fee || 0) / 100);
  const emp = d.employeeId ? I.emp.get(d.employeeId) : null;
  const commPct = emp ? (emp.commissionPct ?? cfg.defaultCommission ?? 0) : 0;
  const date = d.date || nowS();
  const cs = opt.silent ? null : openCash();
  const sale = {
    id: d.id || uid(), number: ++S.meta.saleSeq, date, customerId: d.customerId || null, employeeId: d.employeeId || null,
    channelId: d.channelId || 'loja', items, subtotal, discount, total, paymentMethodId: pm.id, fee,
    tax: r2(goods * (+cfg.taxRate || 0) / 100), commission: r2(goods * (+commPct || 0) / 100), status: 'concluida',
    fulfillment: ful ? { type: ful.type, status: ful.status || 'novo', promisedAt: ful.promisedAt || null, processedAt: ful.processedAt || null, deliveredAt: ful.deliveredAt || null, shippingCharged: shipCharged, shippingCost: r2(ful.shippingCost || 0), address: ful.address || '' } : null,
    error: d.error || null,
    cashSessionId: d.cashSessionId !== undefined ? d.cashSessionId : (pm.kind === 'dinheiro' && cs ? cs.id : null),
    userId: d.userId || currentUser()?.id || null, notes: d.notes || '', createdAt: opt.silent ? date : nowS(),
  };
  S.sales.push(sale);
  for (const it of items) addMove(it.productId, -it.qty, 'venda', sale.id, it.cost, 'Venda #' + sale.number, date);
  const net = r2(total - fee);
  const day = date.slice(0, 10);
  const e = { id: uid(), type: 'in', date: day, amount: net, categoryId: 'vendas', description: 'Venda #' + sale.number + (fee ? ' (taxa de ' + fm(fee) + ' descontada)' : ''), saleId: sale.id, methodId: pm.id, createdAt: sale.createdAt };
  if (pm.kind === 'prazo') { e.status = 'pendente'; e.dueDate = d.dueDate || addDays(day, pm.days || 30); }
  else if ((+pm.days || 0) > 0) { e.status = 'pendente'; e.auto = true; e.dueDate = addDays(day, +pm.days); }
  else { e.status = 'pago'; e.paidDate = day; e.dueDate = day; }
  if (net > 0) S.ledger.push(e);
  if (!opt.silent) commit('criou', 'Venda', 'Venda #' + sale.number + ' — ' + fm(total) + ' (' + pm.name + ')' + (discount > 0 ? ', desconto de ' + fm(discount) : ''), sale.id);
  return sale;
}
function cancelSale(sale, reason, opt = {}) {
  sale.status = 'cancelada'; sale.cancelReason = reason; sale.cancelledAt = opt.at || nowS(); sale.cancelledBy = opt.by || currentUser()?.name || 'Sistema';
  for (const it of sale.items) addMove(it.productId, +it.qty, 'devolucao', sale.id, it.cost, 'Cancelamento da venda #' + sale.number, sale.cancelledAt);
  S.ledger = S.ledger.filter(e => e.saleId !== sale.id);
  if (!opt.silent) commit('cancelou', 'Venda', 'Venda #' + sale.number + ' (' + fm(sale.total) + ') — motivo: ' + reason, sale.id);
}

// ---------- recorrências (contas fixas mensais) ----------
function materializeRecurring(silent) {
  let created = 0;
  const limit = monthKey(addMonths(today(), 1));
  for (const rc of S.recurrences) {
    if (!rc.active) continue;
    let m = rc.startMonth, g = 0;
    const skip = new Set(rc.skip || []);
    const have = new Set(S.ledger.filter(e => e.recId === rc.id).map(e => e.recMonth));
    while (m <= limit && g++ < 600) {
      if (rc.endMonth && m > rc.endMonth) break;
      if (!have.has(m) && !skip.has(m)) {
        const last = +monthEnd(m + '-01').slice(8);
        const date = m + '-' + pad(Math.min(rc.day || 1, last));
        S.ledger.push({ id: uid(), type: rc.type, date, dueDate: date, amount: r2(rc.amount), categoryId: rc.categoryId, description: rc.description, status: 'pendente', recId: rc.id, recMonth: m, employeeId: rc.employeeId || null, channelId: rc.channelId || null, createdAt: nowS() });
        created++;
      }
      m = monthKey(addMonths(m + '-01', 1));
    }
  }
  if (created && !silent) commit(null);
  return created;
}
/* ============================================================
   Motor de indicadores — todos os cálculos saem daqui
   ============================================================ */
const salesIn = r => S.sales.filter(s => s.status !== 'cancelada' && inR(s.date, r));
function memo(key, fnc) { if (MEMO.has(key)) return MEMO.get(key); const v = fnc(); MEMO.set(key, v); return v; }

// Para onde cada categoria vai no resultado (DRE)
function bucketOf(cat, ctx) {
  switch (cat.group) {
    case 'fixa': case 'pessoal': return 'fixa';
    case 'variavel': case 'marketing': return 'variavel';
    case 'imposto': return ctx.taxEstimated ? null : 'variavel';
    case 'comissao': return ctx.commEstimated ? null : 'variavel';
    case 'outra': return 'outra';
    default: return null;
  }
}

/* Resultado completo de um período: vendas, DRE e caixa */
function calc(r) {
  return memo('calc|' + r.from + '|' + r.to, () => {
    const sales = salesIn(r);
    let revenue = 0, cmv = 0, items = 0, fees = 0, taxes = 0, comm = 0, ship = 0, shipCharged = 0, discounts = 0;
    for (const s of sales) {
      revenue += s.total; fees += s.fee || 0; taxes += s.tax || 0; comm += s.commission || 0; discounts += s.discount || 0;
      if (s.fulfillment) { ship += s.fulfillment.shippingCost || 0; shipCharged += s.fulfillment.shippingCharged || 0; }
      for (const it of s.items) { cmv += it.qty * it.cost; items += it.qty; discounts += it.discount || 0; }
    }
    const varCosts = cmv + fees + taxes + comm + ship;
    const mc = revenue - varCosts;
    const ctx = { taxEstimated: taxes > 0, commEstimated: comm > 0 };
    const exp = { fixa: 0, variavel: 0, outra: 0 };
    const byCat = new Map();
    let marketing = 0, pessoal = 0, mercadoria = 0, investimento = 0, retirada = 0;
    for (const e of S.ledger) {
      if (!inR(e.date, r)) continue;
      const c = catOf(e.categoryId);
      if (c.group === 'marketing') marketing += e.amount;
      if (c.group === 'pessoal') pessoal += e.amount;
      if (c.group === 'mercadoria') mercadoria += e.amount;
      if (c.group === 'investimento') investimento += e.amount;
      if (c.group === 'retirada') retirada += e.amount;
      const b = bucketOf(c, ctx);
      if (!b) continue;
      exp[b] += e.amount;
      if (b !== 'outra') byCat.set(e.categoryId, (byCat.get(e.categoryId) || 0) + e.amount);
    }
    const lossesReg = sum(S.losses.filter(l => inR(l.date, r)), l => l.amount);
    let shortages = 0, overages = 0, cashDiffCount = 0, cashClosed = 0;
    for (const c of S.cash) {
      if (!c.closedAt || !inR(c.closedAt, r)) continue;
      cashClosed++;
      const d = c.difference || 0;
      if (d < -0.005) { shortages += -d; cashDiffCount++; } else if (d > 0.005) { overages += d; cashDiffCount++; }
    }
    let invNet = 0, invItems = 0, invAbs = 0;
    for (const ct of S.counts) {
      if (!inR(ct.date, r)) continue;
      for (const it of ct.items) { const dq = it.countedQty - it.systemQty; if (dq) { invItems++; const v = dq * (it.unitCost || 0); invAbs += Math.abs(v); if (ct.applied) invNet += v; } }
    }
    const perdas = lossesReg + shortages - overages - invNet;
    const opex = exp.fixa + exp.variavel;
    const net = mc + exp.outra - opex - perdas;
    const mcPct = div(mc, revenue);
    const pe = mcPct > 0 ? opex / mcPct : Infinity;
    // caixa (pela data em que o dinheiro entrou/saiu)
    let cin = 0, cout = 0;
    for (const e of S.ledger) {
      const pd = paidDate(e);
      if (!pd || pd < r.from || pd > r.to) continue;
      if (e.type === 'in') cin += e.amount; else cout += e.amount;
    }
    return {
      r, sales, count: sales.length, revenue, cmv, items, fees, taxes, comm, ship, shipCharged, discounts, varCosts, mc, mcPct,
      fixa: exp.fixa, variavel: exp.variavel, outra: exp.outra, opex, byCat, marketing, pessoal, mercadoria, investimento, retirada,
      lossesReg, shortages, overages, cashDiffCount, cashClosed, invNet, invItems, invAbs, perdas, net, netPct: div(net, revenue),
      pe, peGap: pe - revenue, ticket: div(revenue, sales.length), cin, cout, flow: cin - cout,
    };
  });
}

function balanceAt(date) {
  let b = +S.config.initialBalance || 0;
  for (const e of S.ledger) { const pd = paidDate(e); if (pd && pd <= date) b += e.type === 'in' ? e.amount : -e.amount; }
  return b;
}
function pendings() {
  return memo('pend', () => {
    const t = today(); const rec = [], pay = [];
    for (const e of S.ledger) { if (paidDate(e)) continue; (e.type === 'in' ? rec : pay).push(e); }
    const by = (a, b) => (a.dueDate || a.date) < (b.dueDate || b.date) ? -1 : 1;
    rec.sort(by); pay.sort(by);
    const due = e => e.dueDate || e.date;
    return {
      rec, pay, recTotal: sum(rec, e => e.amount), payTotal: sum(pay, e => e.amount),
      overdueRec: rec.filter(e => !e.auto && due(e) < t), overduePay: pay.filter(e => due(e) < t),
      soonPay: pay.filter(e => due(e) >= t && due(e) <= addDays(t, 3)),
    };
  });
}

/* Agrupamento automático por dia, semana ou mês conforme o tamanho do período */
function buckets(r) {
  const n = daysInRange(r);
  if (n <= 45) { const keys = eachDay(r); return { kind: 'dia', keys, keyOf: d => String(d).slice(0, 10), label: fds, title: k => SEMANA[parseD(k).getDay()] + ', ' + fd(k) }; }
  if (n <= 200) {
    const keys = []; let w = weekStart(r.from), g = 0;
    while (w <= r.to && g++ < 60) { keys.push(w); w = addDays(w, 7); }
    return { kind: 'semana', keys, keyOf: d => weekStart(d), label: fds, title: k => 'Semana de ' + fd(k < r.from ? r.from : k) };
  }
  const keys = []; let m = monthKey(r.from), g = 0;
  while (m <= monthKey(r.to) && g++ < 240) { keys.push(m); m = monthKey(addMonths(m + '-01', 1)); }
  return { kind: 'mês', keys, keyOf: d => String(d).slice(0, 7), label: monthShort, title: monthLabel };
}
function seriesOf(bk, list, dateOf, valOf) {
  const m = new Map(bk.keys.map(k => [k, 0]));
  for (const x of list) { const k = bk.keyOf(dateOf(x)); if (m.has(k)) m.set(k, m.get(k) + (valOf ? valOf(x) : 1)); }
  return bk.keys.map(k => m.get(k));
}

/* Vendas por produto (margem de lucro por produto e curva ABC) */
function productPerf(r) {
  return memo('pp|' + r.from + '|' + r.to, () => {
    const m = new Map();
    for (const s of salesIn(r)) {
      const goods = s.subtotal || 0;
      const extra = (s.fee || 0) + (s.tax || 0) + (s.commission || 0);
      const share = div(s.total - (s.fulfillment?.shippingCharged || 0), goods); // fração da receita do item após desconto geral
      for (const it of s.items) {
        const gross = it.qty * it.price - (it.discount || 0);
        const rev = gross * share;
        const varShare = div(rev, s.total) * extra;
        let p = m.get(it.productId);
        if (!p) { p = { id: it.productId, name: it.name, qty: 0, rev: 0, cmv: 0, varc: 0, count: 0 }; m.set(it.productId, p); }
        p.qty += it.qty; p.rev += rev; p.cmv += it.qty * it.cost; p.varc += varShare; p.count++;
      }
    }
    const rows = [...m.values()].map(p => ({ ...p, name: ix().prod.get(p.id)?.name || p.name, profit: p.rev - p.cmv - p.varc, margin: div(p.rev - p.cmv - p.varc, p.rev) }));
    rows.sort((a, b) => b.rev - a.rev);
    const tot = sum(rows, x => x.rev); let acc = 0;
    for (const x of rows) { acc += x.rev; const sh = div(acc - x.rev, tot); x.abc = sh < 0.8 ? 'A' : sh < 0.95 ? 'B' : 'C'; x.share = div(x.rev, tot); }
    return rows;
  });
}

/* Estoque */
function stockStatus(p) { if ((p.stock || 0) <= 0) return 'zero'; if ((p.stock || 0) <= (p.minStock || 0)) return 'baixo'; return 'ok'; }
function stockValueAt(date) {
  // valor do estoque no fim de "date", desfazendo os movimentos posteriores
  const after = new Map();
  for (const mv of S.moves) if (mv.date.slice(0, 10) > date) after.set(mv.productId, (after.get(mv.productId) || 0) + mv.qty);
  let v = 0;
  for (const p of S.products) { if (p.active === false && !(p.stock > 0)) continue; const q = (p.stock || 0) - (after.get(p.id) || 0); if (q > 0) v += q * (+p.cost || 0); }
  return v;
}
function stockMetrics(r) {
  return memo('st|' + r.from + '|' + r.to, () => {
    const act = S.products.filter(p => p.active !== false);
    const units = sum(act, p => Math.max(0, p.stock || 0));
    const cost = sum(act, p => Math.max(0, p.stock || 0) * (+p.cost || 0));
    const saleValue = sum(act, p => Math.max(0, p.stock || 0) * (+p.price || 0));
    const low = act.filter(p => stockStatus(p) === 'baixo'), zero = act.filter(p => stockStatus(p) === 'zero');
    const start = stockValueAt(addDays(r.from, -1)), end = stockValueAt(r.to);
    const avgStock = (start + end) / 2;
    const c = calc(r);
    const giro = div(c.cmv, avgStock);
    const days = daysInRange(r);
    const cover = c.cmv > 0 ? cost / (c.cmv / days) : Infinity;
    return { act, units, cost, saleValue, low, zero, avgStock, giro, cover, days };
  });
}

/* Clientes */
function custMetrics(r) {
  return memo('cu|' + r.from + '|' + r.to, () => {
    const st = ix().custStats; const cfg = S.config;
    const activeSince = addDays(r.to, -((+cfg.activeDays || 90) - 1));
    let active = 0, newC = 0, buyers = 0, repeaters = 0, ltvRev = 0;
    for (const [, cs] of st) {
      const upTo = cs.dates.filter(d => d.slice(0, 10) <= r.to);
      if (!upTo.length) continue;
      buyers++;
      if (upTo.length >= 2) repeaters++;
      if (upTo[upTo.length - 1].slice(0, 10) >= activeSince) active++;
      if (inR(cs.first, r)) newC++;
    }
    for (const s of ix().salesSorted) if (s.customerId && s.date.slice(0, 10) <= r.to) ltvRev += s.total;
    const sr = salesIn(r);
    const ident = sr.filter(s => s.customerId);
    const distinct = new Set(ident.map(s => s.customerId));
    let returning = 0;
    for (const id of distinct) { const cs = st.get(id); if (cs && cs.first.slice(0, 10) < r.from) returning++; }
    const revIdent = sum(ident, s => s.total);
    const c = calc(r);
    const ltv = div(ltvRev, buyers);
    return {
      active, newC, buyers, repeaters, repurchase: div(repeaters, buyers), distinct: distinct.size, returning,
      ticketCli: div(revIdent, distinct.size), freq: div(ident.length, distinct.size), ltv, ltvProfit: ltv * Math.max(0, c.mcPct),
      identPct: div(ident.length, sr.length), revIdent,
    };
  });
}
function customerRows() {
  const st = ix().custStats; const t = today(); const cfg = S.config;
  const rows = S.customers.map(c => {
    const cs = st.get(c.id);
    const days = cs ? diffDays(cs.last.slice(0, 10), t) : Infinity;
    let seg = 'sem';
    if (cs) seg = days < (+cfg.activeDays || 90) ? (cs.count >= 2 ? 'ativo' : (diffDays(cs.first.slice(0, 10), t) <= 30 ? 'novo' : 'ativo')) : (cs.count >= 2 ? 'risco' : 'inativo');
    return { ...c, count: cs ? cs.count : 0, total: cs ? cs.total : 0, last: cs ? cs.last : null, first: cs ? cs.first : null, days, seg, ticket: cs ? cs.total / cs.count : 0 };
  });
  const sortedT = rows.filter(x => x.total > 0).map(x => x.total).sort((a, b) => b - a);
  const vipCut = sortedT.length >= 10 ? sortedT[Math.floor(sortedT.length * 0.1)] : Infinity;
  for (const x of rows) x.vip = x.total >= vipCut && x.total > 0;
  return rows;
}

/* Marketing */
function mktMetrics(r) {
  return memo('mk|' + r.from + '|' + r.to, () => {
    const I = ix();
    const ents = S.ledger.filter(e => inR(e.date, r) && catOf(e.categoryId).group === 'marketing');
    const invest = sum(ents, e => e.amount);
    const ch = new Map();
    const get = id => { const k = id || 'outro'; if (!ch.has(k)) ch.set(k, { id: k, name: chName(k), spend: 0, rev: 0, count: 0, newC: 0, paid: !!I.ch.get(k)?.paid }); return ch.get(k); };
    for (const e of ents) get(e.channelId).spend += e.amount;
    const sr = salesIn(r);
    for (const s of sr) { const x = get(s.channelId); x.rev += s.total; x.count++; }
    for (const [cid, cs] of I.custStats) {
      if (!inR(cs.first, r)) continue;
      const cu = I.cust.get(cid);
      get(cu?.channelId || cs.firstChannel).newC++;
    }
    const rows = [...ch.values()];
    for (const x of rows) { x.roas = div(x.rev, x.spend); x.cac = div(x.spend, x.newC); }
    rows.sort((a, b) => b.rev - a.rev);
    const paidRows = rows.filter(x => x.spend > 0);
    const paidRev = sum(paidRows, x => x.rev);
    const newC = custMetrics(r).newC;
    const mcPct = calc(r).mcPct;
    const campaigns = groupBy(ents, e => (e.campaign || '').trim() || 'Sem campanha');
    return {
      ents, invest, rows, paidRev, newC, cac: div(invest, newC), roas: div(paidRev, invest),
      roi: invest ? (paidRev * Math.max(0, mcPct) - invest) / invest : 0, campaigns,
    };
  });
}

/* Funcionários */
function teamMetrics(r) {
  return memo('tm|' + r.from + '|' + r.to, () => {
    const t = today();
    const sr = salesIn(r);
    const pay = S.ledger.filter(e => inR(e.date, r) && catOf(e.categoryId).group === 'pessoal');
    const payroll = sum(pay, e => e.amount);
    const days = daysInRange(r);
    const estimated = sum(S.employees.filter(e => e.active !== false), e => ((+e.salary || 0) * (1 + (+e.chargesPct || 0) / 100) + (+e.benefits || 0)) * days / 30.4);
    const byEmp = groupBy(sr, s => s.employeeId || '');
    const rows = S.employees.map(e => {
      const s = byEmp.get(e.id) || [];
      const from = e.hireDate && e.hireDate > r.from ? e.hireDate : r.from;
      let to = r.to < t ? r.to : t;
      if (e.active === false && e.leftDate && e.leftDate < to) to = e.leftDate;
      const workDays = from <= to ? Math.round(diffDays(from, to)) + 1 : 0;
      const sched = (+e.weeklyHours || 0) / 7 * workDays;
      const absH = sum(S.absences.filter(a => a.employeeId === e.id && inR(a.date, r)), a => a.hours);
      const worked = Math.max(0, sched - absH);
      const rev = sum(s, x => x.total);
      const cost = sum(pay.filter(p => p.employeeId === e.id), p => p.amount);
      return { e, id: e.id, name: e.name, role: e.role, count: s.length, rev, ticket: div(rev, s.length), comm: sum(s, x => x.commission || 0), sched, absH, worked, perH: div(rev, worked), abs: div(absH, sched), cost };
    });
    const none = byEmp.get('') || [];
    const sellers = rows.filter(x => x.count > 0);
    const totSched = sum(rows, x => x.sched), totAbs = sum(rows, x => x.absH), totWorked = sum(rows, x => x.worked);
    const revByEmp = sum(sellers, x => x.rev);
    return {
      payroll, estimated, usedEstimate: payroll === 0 && estimated > 0, cost: payroll || estimated, rows, none,
      perSeller: div(revByEmp, sellers.length), perH: div(revByEmp, sum(sellers, x => x.worked)) || div(revByEmp, totWorked),
      abs: div(totAbs, totSched), totAbs, totSched, comm: sum(sr, s => s.commission || 0), sellers: sellers.length,
    };
  });
}

/* Operação e logística */
function opsMetrics(r) {
  return memo('op|' + r.from + '|' + r.to, () => {
    const sr = salesIn(r);
    const orders = sr.filter(s => s.fulfillment);
    const proc = orders.filter(s => s.fulfillment.processedAt).map(s => diffHours(s.date, s.fulfillment.processedAt)).filter(h => h >= 0);
    const deliv = orders.filter(s => s.fulfillment.deliveredAt && s.fulfillment.promisedAt);
    const onTime = deliv.filter(s => s.fulfillment.deliveredAt <= s.fulfillment.promisedAt);
    const errs = sr.filter(s => s.error);
    const c = calc(r);
    const now = nowS();
    const open = S.sales.filter(s => s.status !== 'cancelada' && s.fulfillment && !s.fulfillment.deliveredAt);
    const late = open.filter(s => s.fulfillment.promisedAt && s.fulfillment.promisedAt < now);
    return {
      orders, proc: avg(proc), procN: proc.length, deliv, onTime, onTimePct: div(onTime.length, deliv.length), errs, errPct: div(errs.length, sr.length),
      opCost: div(c.opex + c.ship, sr.length), count: sr.length, open, late, errTypes: groupBy(errs, s => s.error.type || 'Outro'),
    };
  });
}

/* Fornecedores e compras */
function supMetrics(r) {
  return memo('su|' + r.from + '|' + r.to, () => {
    const ps = S.purchases.filter(p => p.status !== 'cancelada' && inR(p.orderDate, r));
    const recv = ps.filter(p => p.receivedDate);
    const lead = recv.map(p => diffDays(p.orderDate, p.receivedDate));
    const onTime = recv.filter(p => !p.expectedDate || p.receivedDate <= p.expectedDate);
    const term = ps.filter(p => p.dueDate).map(p => diffDays(p.orderDate, p.dueDate));
    const rows = S.suppliers.map(s => {
      const mine = ps.filter(p => p.supplierId === s.id); const rc = mine.filter(p => p.receivedDate);
      return { s, id: s.id, name: s.name, count: mine.length, total: sum(mine, p => p.total), lead: avg(rc.map(p => diffDays(p.orderDate, p.receivedDate))), onTime: div(rc.filter(p => !p.expectedDate || p.receivedDate <= p.expectedDate).length, rc.length), rcN: rc.length, term: avg(mine.filter(p => p.dueDate).map(p => diffDays(p.orderDate, p.dueDate))) };
    }).sort((a, b) => b.total - a.total);
    const open = S.purchases.filter(p => p.status === 'pedido');
    return { ps, total: sum(ps, p => p.total), lead: avg(lead), onTimePct: div(onTime.length, recv.length), recvN: recv.length, term: avg(term), rows, open };
  });
}

/* Precificação: percentuais médios dos últimos 90 dias */
function pricingCtx() {
  return memo('pc', () => {
    const r = { from: addDays(today(), -89), to: today() };
    const c = calc(r);
    const cfg = S.config;
    const cards = cfg.paymentMethods.filter(p => p.fee > 0);
    const feePct = c.revenue ? c.fees / c.revenue : (cards.length ? avg(cards.map(p => p.fee)) / 100 / 2 : 0);
    const commPct = c.revenue ? c.comm / c.revenue : (+cfg.defaultCommission || 0) / 100;
    const taxPct = (+cfg.taxRate || 0) / 100;
    const fixedPct = c.revenue ? c.opex / c.revenue : 0;
    return { feePct, commPct, taxPct, fixedPct, target: (+cfg.targetMargin || 0) / 100, base: c };
  });
}
function priceRow(p, ctx) {
  const unit = unitCost(p), price = +p.price || 0;
  const varPct = ctx.taxPct + ctx.feePct + ctx.commPct;
  const varUnit = unit + price * varPct;
  const mc = price - varUnit;
  const mcPct = div(mc, price);
  const d1 = 1 - varPct - ctx.fixedPct, d2 = d1 - ctx.target;
  const min = d1 > 0 ? unit / d1 : Infinity;
  const sug = d2 > 0 ? unit / d2 : Infinity;
  const status = price < min - 0.004 ? 'crit' : price < sug - 0.004 ? 'warn' : 'good';
  return { p, unit, price, varUnit, mc, mcPct, min, sug, status, markup: div(price, unit), profitUnit: price - varUnit - price * ctx.fixedPct };
}

/* Planejamento */
function goalFor(m) { const g = S.goals[m]; return { revenue: g && g.revenue != null ? +g.revenue : +S.config.monthlyGoal || 0, profit: g && g.profit != null ? +g.profit : 0, custom: !!g }; }
function monthRange(m) { const f = m + '-01', e = monthEnd(f), t = today(); return { from: f, to: e < t ? e : (f > t ? f : t) }; }
function projection(days = 90) {
  return memo('pj|' + days, () => {
    const t = today();
    const start = balanceAt(t);
    const P = pendings();
    const sched = new Map();
    for (const e of [...P.rec, ...P.pay]) {
      let d = e.dueDate || e.date; if (d <= t) d = addDays(t, 1);
      sched.set(d, (sched.get(d) || 0) + (e.type === 'in' ? e.amount : -e.amount));
    }
    // Tendência: média diária do que entrou e saiu nos últimos 60 dias (sem contas fixas, aportes e investimentos).
    // Cada movimento conta a partir do seu prazo habitual (ex.: crédito em 30 dias), para não somar de novo
    // o que já está agendado como conta a receber ou a pagar.
    const from = addDays(t, -59);
    const firstD = firstDataDate();
    const span = Math.max(1, Math.min(60, Math.round(diffDays(firstD > from ? firstD : from, t)) + 1));
    const byLag = new Array(days + 2).fill(0);
    for (const e of S.ledger) {
      const pd = paidDate(e); if (!pd || pd < from || pd > t) continue;
      if (e.recId) continue;
      const g = catOf(e.categoryId).group; if (g === 'aporte' || g === 'investimento') continue;
      const lag = clamp(Math.round(diffDays(e.date, pd)), 0, days + 1);
      byLag[lag] += (e.type === 'in' ? e.amount : -e.amount) / span;
    }
    const trend = sum(byLag);
    const labels = [t], a = [start], b = [start];
    let sa = start, sb = start, minB = start, minD = t, minA = start, minAD = t, run = 0;
    for (let i = 1; i <= days; i++) {
      const d = addDays(t, i);
      const s = sched.get(d) || 0;
      run += byLag[i - 1];
      sa += s; sb += s + run;
      labels.push(d); a.push(sa); b.push(sb);
      if (sb < minB) { minB = sb; minD = d; }
      if (sa < minA) { minA = sa; minAD = d; }
    }
    return { labels, a, b, start, trend, minB, minD, minA, minAD };
  });
}

/* Segurança */
function secMetrics(r) {
  return memo('se|' + r.from + '|' + r.to, () => {
    const c = calc(r);
    const sessions = S.cash.filter(x => x.closedAt && inR(x.closedAt, r));
    const counts = S.counts.filter(x => inR(x.date, r));
    const losses = S.losses.filter(l => inR(l.date, r));
    const lossByType = groupBy(losses, l => l.type);
    const sr = S.sales.filter(s => inR(s.date, r));
    const hi = (+S.config.highDiscount || 15) / 100;
    const highDisc = sr.filter(s => s.status !== 'cancelada' && div(s.discount + sum(s.items, i => i.discount || 0), s.subtotal + sum(s.items, i => i.discount || 0)) >= hi);
    const cancels = sr.filter(s => s.status === 'cancelada');
    const adjusts = S.moves.filter(m => m.type === 'ajuste' && inR(m.date, r));
    const auditR = S.audit.filter(a => inR(a.at, r));
    const users = new Map();
    const U = name => { const k = name || 'Sistema'; if (!users.has(k)) users.set(k, { name: k, ops: 0, cancels: 0, disc: 0, adj: 0, cashDiff: 0, cashN: 0 }); return users.get(k); };
    for (const a of auditR) U(a.user).ops++;
    for (const s of cancels) U(s.cancelledBy).cancels++;
    for (const s of highDisc) U(ix().user.get(s.userId)?.name).disc++;
    for (const m of adjusts) U(m.user).adj++;
    for (const x of sessions) { const u = U(x.closedBy); u.cashDiff += x.difference || 0; if (Math.abs(x.difference || 0) > 0.005) u.cashN++; }
    return {
      c, sessions, counts, losses, lossByType, highDisc, cancels, adjusts, auditR, users: [...users.values()].sort((a, b) => b.ops - a.ops),
      lossTotal: c.lossesReg + c.shortages, fraud: sum(losses.filter(l => ['furto', 'fraude', 'erro'].includes(l.type)), l => l.amount) + c.shortages,
    };
  });
}

/* Satisfação */
function satMetrics(r) {
  return memo('sa|' + r.from + '|' + r.to, () => {
    const rv = S.reviews.filter(x => inR(x.date, r));
    const cp = S.complaints.filter(x => inR(x.openedAt, r));
    const resolved = S.complaints.filter(x => x.status === 'resolvida' && x.resolvedAt && inR(x.resolvedAt, r));
    const resH = resolved.map(x => diffHours(x.openedAt, x.resolvedAt)).filter(h => h >= 0);
    const sales = salesIn(r).length;
    const after = new Map(); // cliente -> data da primeira experiência registrada no período
    const kind = new Map();
    for (const x of rv) if (x.customerId) { const d = x.date; if (!after.has(x.customerId) || d < after.get(x.customerId)) after.set(x.customerId, d); if (!kind.has(x.customerId)) kind.set(x.customerId, x.rating >= 4 ? 'pos' : 'neg'); }
    for (const x of cp) if (x.customerId) { const d = x.openedAt; if (!after.has(x.customerId) || d < after.get(x.customerId)) after.set(x.customerId, d); kind.set(x.customerId, 'recl'); }
    let back = 0; const by = { pos: [0, 0], neg: [0, 0], recl: [0, 0] };
    for (const [cid, d] of after) {
      const cs = ix().custStats.get(cid);
      const came = !!(cs && cs.dates.some(x => x > d));
      if (came) back++;
      const k = kind.get(cid) || 'pos'; by[k][1]++; if (came) by[k][0]++;
    }
    const dist = [5, 4, 3, 2, 1].map(n => ({ n, c: rv.filter(x => x.rating === n).length }));
    return {
      rv, cp, resolved, avgRating: avg(rv.map(x => x.rating)), dist, rate: div(cp.length, sales), resH: avg(resH), back, base: after.size, backPct: div(back, after.size), by,
      open: S.complaints.filter(x => x.status !== 'resolvida'), cats: groupBy(cp, x => x.category || 'Outro'),
    };
  });
}

/* Alertas do painel */
function alerts() {
  const out = []; const t = today(); const now = nowS();
  const P = pendings();
  if (P.overduePay.length) out.push({ sev: 'crit', t: '<b>' + plural(P.overduePay.length, 'conta vencida', 'contas vencidas') + '</b> a pagar: ' + fm(sum(P.overduePay, e => e.amount)), go: 'financeiro', tab: ['fin', 'contas'] });
  if (P.soonPay.length) out.push({ sev: 'warn', t: plural(P.soonPay.length, 'conta vence', 'contas vencem') + ' nos próximos 3 dias: ' + fm(sum(P.soonPay, e => e.amount)), go: 'financeiro', tab: ['fin', 'contas'] });
  if (P.overdueRec.length) out.push({ sev: 'warn', t: plural(P.overdueRec.length, 'recebimento atrasado', 'recebimentos atrasados') + ' (fiado/a prazo): ' + fm(sum(P.overdueRec, e => e.amount)), go: 'financeiro', tab: ['fin', 'contas'] });
  const act = S.products.filter(p => p.active !== false);
  const zero = act.filter(p => stockStatus(p) === 'zero'), low = act.filter(p => stockStatus(p) === 'baixo');
  if (zero.length) out.push({ sev: 'crit', t: '<b>' + plural(zero.length, 'produto zerado', 'produtos zerados') + '</b> no estoque', go: 'estoque' });
  if (low.length) out.push({ sev: 'warn', t: plural(low.length, 'produto com estoque baixo', 'produtos com estoque baixo'), go: 'estoque' });
  const ops = opsMetrics({ from: t, to: t });
  if (ops.late.length) out.push({ sev: 'crit', t: '<b>' + plural(ops.late.length, 'pedido atrasado', 'pedidos atrasados') + '</b> para entrega', go: 'operacao' });
  const openC = S.complaints.filter(x => x.status !== 'resolvida');
  if (openC.length) out.push({ sev: 'warn', t: plural(openC.length, 'reclamação em aberto', 'reclamações em aberto'), go: 'satisfacao' });
  const cs = openCash();
  if (cs && diffHours(cs.openedAt, now) > 14) out.push({ sev: 'warn', t: 'O caixa está aberto desde ' + fdt(cs.openedAt) + '. Faça o fechamento.', go: 'caixa' });
  const ctx = pricingCtx();
  const below = act.filter(p => p.price > 0 && priceRow(p, ctx).status === 'crit');
  if (below.length) out.push({ sev: 'warn', t: plural(below.length, 'produto vendido abaixo', 'produtos vendidos abaixo') + ' do preço mínimo sustentável', go: 'precificacao' });
  const m = calc({ from: monthStart(t), to: t });
  if (m.cashDiffCount) out.push({ sev: 'info', t: plural(m.cashDiffCount, 'fechamento de caixa', 'fechamentos de caixa') + ' com diferença neste mês (' + fm(m.overages - m.shortages) + ')', go: 'seguranca' });
  if (!S.meta.demo && (S.sales.length || S.products.length)) {
    const lb = S.meta.lastBackup; const d = lb ? diffDays(lb.slice(0, 10), t) : 999;
    if (d >= 7) out.push({ sev: 'info', t: lb ? 'Último backup ' + ago(lb) + '. Faça um novo backup.' : 'Você ainda não fez nenhum backup dos dados.', go: 'config', tab: ['cfg', 'dados'] });
  }
  return out;
}

/* ---------- KPIs ---------- */
function delta(cur, prev, goodUp = true) {
  if (prev === undefined || prev === null || !isFinite(cur) || !isFinite(prev)) return '';
  if (Math.abs(prev) < 0.005 && Math.abs(cur) < 0.005) return '';
  if (Math.abs(prev) < 0.005) return '<span class="delta muted">sem base anterior</span>';
  const p = (cur - prev) / Math.abs(prev);
  if (Math.abs(p) < 0.0005) return '<span class="delta muted">= período anterior</span>';
  const up = p > 0, good = up === goodUp;
  return '<span class="delta ' + (good ? 'pos' : 'neg') + '">' + (up ? '▲' : '▼') + ' ' + fp(Math.abs(p)) + ' <span class="muted" style="font-weight:500">vs anterior</span></span>';
}
function kpi(o) {
  return '<div class="kpi ' + (o.cls || '') + '"><div class="kpi-h"><span class="kpi-l">' + esc(o.l) + '</span>' + (o.i ? '<button class="qi" data-act="info" data-k="' + o.i + '" aria-label="Como é calculado: ' + esc(o.l) + '">?</button>' : '') + '</div><div class="kpi-v">' + o.v + '</div>' + (o.d || '') + (o.s ? '<div class="kpi-s">' + o.s + '</div>' : '') + '</div>';
}
const kpis = list => '<div class="kpis' + (list.length % 2 ? ' odd' : '') + '">' + list.map(kpi).join('') + '</div>';
const chip = (t, c = '') => '<span class="chip ' + c + '">' + esc(t) + '</span>';
const stars = n => '<span class="stv" aria-label="' + n + ' de 5">' + '★'.repeat(Math.round(n)) + '<span style="color:var(--line-2)">' + '★'.repeat(5 - Math.round(n)) + '</span></span>';
const moneyCls = v => (v < -0.004 ? 'neg' : v > 0.004 ? 'pos' : '');
const card = (title, body, opt = {}) => '<section class="card ' + (opt.cls || '') + '">' + (title ? '<div class="card-h"><h2>' + esc(title) + '</h2>' + (opt.i ? '<button class="qi" data-act="info" data-k="' + opt.i + '" aria-label="Como é calculado">?</button>' : '') + (opt.a || '') + (opt.sub ? '<div class="sub">' + opt.sub + '</div>' : '') + '</div>' : '') + body + '</section>';
const emptyBox = (t, sub, btn) => '<div class="empty"><b>' + esc(t) + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + (btn || '') + '</div>';
function pageHead(eyebrow, title, desc, actions) {

}
function tabs(group, list, cur) {
  return '<div class="tabs" role="tablist">' + list.map(([v, l]) => '<button role="tab" aria-selected="' + (v === cur) + '" class="' + (v === cur ? 'on' : '') + '" data-act="tab" data-g="' + group + '" data-v="' + v + '">' + esc(l) + '</button>').join('') + '</div>';
}

/* ---------- barras horizontais ---------- */
function hbars(items, fmt = fm, opt = {}) {
  if (!items.length) return emptyBox(opt.empty || 'Sem dados no período');
  const max = Math.max(...items.map(x => Math.abs(x.v)), 0.0001);
  return '<div class="hb">' + items.map(x => '<div class="hb-row" title="' + esc(x.l) + ': ' + esc(fmt(x.v)) + '"><div class="hb-l">' + esc(x.l) + '</div><div class="hb-t"><div class="hb-f" style="width:' + (Math.abs(x.v) / max * 100).toFixed(2) + '%' + (x.c ? ';background:var(' + x.c + ')' : '') + '"></div></div><div class="hb-v">' + esc(fmt(x.v)) + (x.sub ? '<small class="muted">' + esc(x.sub) + '</small>' : '') + '</div></div>').join('') + '</div>';
}

/* ---------- tabelas com busca, ordenação e "mostrar mais" ---------- */
const TBL = new Map();
function table(id, o) {
  TBL.set(id, o);
  const st = UI.tbl[id] || (UI.tbl[id] = { q: '', sort: o.sort || null, dir: o.dir || -1, lim: o.limit || 50 });
  return '<div class="tbl" id="tbl-' + id + '">' + (o.search !== false && o.rows.length > 6 ? '<div class="tbl-tools"><label class="search">' + ic('search', 'sm') + '<input type="search" placeholder="' + esc(o.ph || 'Buscar…') + '" value="' + esc(st.q) + '" data-inp="tblq" data-t="' + id + '" aria-label="Buscar na tabela"></label>' + (o.tools || '') + '</div>' : (o.tools ? '<div class="tbl-tools">' + o.tools + '</div>' : '')) + '<div class="tbl-body">' + tableBody(id) + '</div></div>';
}
function tableBody(id) {
  const o = TBL.get(id); const st = UI.tbl[id];
  let rows = o.rows;
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => (o.text ? o.text(r) : o.cols.map(c => (c.s ? c.s(r) : '')).join(' ')).toLowerCase().includes(q)); }
  if (st.sort) { const c = o.cols.find(c => c.k === st.sort); if (c && c.s) { rows = rows.slice().sort((a, b) => { const x = c.s(a), y = c.s(b); return (x < y ? -1 : x > y ? 1 : 0) * st.dir; }); } }
  if (!rows.length) return o.emptyHtml || emptyBox(st.q ? 'Nada encontrado para "' + st.q + '"' : (o.empty || 'Nenhum registro ainda'), st.q ? '' : (o.emptySub || ''), st.q ? '' : (o.emptyBtn || ''));
  const shown = rows.slice(0, st.lim);
  let h = '<div class="tbl-wrap"><table class="rt"><thead><tr>' + o.cols.map(c => '<th class="' + (c.num ? 'num ' : '') + (c.s ? 'sortable' : '') + '" ' + (c.s ? 'data-act="tsort" data-t="' + id + '" data-k="' + c.k + '"' : '') + '>' + esc(c.l) + (st.sort === c.k ? '<span class="ar">' + (st.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>').join('') + '</tr></thead><tbody>';
  for (const r of shown) {
    h += '<tr' + (o.act ? ' class="click" data-act="' + o.act + '" data-id="' + esc(o.rowId ? o.rowId(r) : r.id) + '" tabindex="0"' : '') + '>' + o.cols.map((c, i) => { const v = c.f(r); return '<td class="' + (c.num ? 'num ' : '') + (i === 0 && !c.num ? 'main' : '') + '" data-l="' + esc(c.l) + '">' + (v === undefined || v === null ? '' : v) + '</td>'; }).join('') + '</tr>';
  }
  h += '</tbody></table></div>';
  if (rows.length > shown.length) h += '<div class="tbl-more"><button class="btn sm" data-act="tmore" data-t="' + id + '">Mostrar mais (' + fi(rows.length - shown.length) + ' restantes)</button></div>';
  return h;
}

/* ---------- toast ---------- */

/* ---------- modal ---------- */
let mdlSeq = 0;
function modal(o) {
  const n = ++mdlSeq;
  const wrap = document.createElement('div');
  wrap.className = 'ovl';
  wrap.innerHTML = '<div class="mdl ' + (o.size || '') + '" role="dialog" aria-modal="true" aria-labelledby="mdl-t-' + n + '"><div class="mdl-h"><h2 id="mdl-t-' + n + '">' + esc(o.title) + '</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">' + ic('x') + '</button></div><div class="mdl-b">' + (o.body || '') + '</div>' + (o.foot ? '<div class="mdl-f">' + o.foot + '</div>' : '') + '</div>';
  document.body.appendChild(wrap);
  document.body.classList.add('noscroll');
  let closed = false;
  const close = () => { if (closed) return; closed = true; wrap.remove(); if (!$('.ovl')) document.body.classList.remove('noscroll'); if (o.onClose) o.onClose(); };
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
  wrap._close = close;
  setTimeout(() => {
    const f = wrap.querySelector('[autofocus]') || (matchMedia('(pointer:fine)').matches ? wrap.querySelector('.mdl-b input:not([type=checkbox]):not([type=radio]):not([type=search]), .mdl-b select, .mdl-b textarea') : null);
    if (f) try { f.focus(); } catch (e) { /* ok */ }
  }, 30);
  return { el: wrap, close };
}

const closeAllModals = () => { for (const m of $$('.ovl')) m._close(); };

function ask(o) {

    let done = false;
    const m = modal({
      title: o.title, size: 'sm',
      body: '<p>' + o.text + '</p>' + (o.type ? '<div class="fld" style="margin-top:14px"><label for="ask-in">Digite <b>' + esc(o.type) + '</b> para confirmar</label><input id="ask-in" autocomplete="off" autocapitalize="characters"></div>' : ''),
      foot: '<span class="sp"></span><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn ' + (o.danger ? 'danger' : 'pri') + '" id="ask-ok">' + esc(o.ok || 'Confirmar') + '</button>',

      done = true; res(true); m.close();
    };
  });
}

function fieldHtml(f, v) {

    case 'select': { const opts = typeof f.opts === 'function' ? f.opts() : f.opts; inp = '<select id="' + id + '" name="' + f.k + '">' + opts.map(([ov, ol]) => '<option value="' + esc(ov) + '"' + (String(ov) === String(v ?? '') ? ' selected' : '') + '>' + esc(ol) + '</option>').join('') + '</select>'; break; }

    case 'stars': return '<div class="fld"' + show + '><span class="lb">' + esc(f.l) + '</span><div class="stars" role="radiogroup" aria-label="' + esc(f.l) + '">' + [5, 4, 3, 2, 1].map(n => '<input type="radio" name="' + f.k + '" value="' + n + '" id="' + id + '_' + n + '"' + (+v === n ? ' checked' : '') + '><label for="' + id + '_' + n + '" title="' + n + ' estrela' + (n > 1 ? 's' : '') + '">★</label>').join('') + '</div>' + help + '</div>';
