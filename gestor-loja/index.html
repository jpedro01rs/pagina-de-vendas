function openForm(o) {
  const vals = Object.assign({}, o.values || {});
  const m = modal({
    title: o.title, size: o.size,
    body: (o.intro ? '<p class="ink2" style="margin-bottom:14px">' + o.intro + '</p>' : '') + '<form class="frm" id="frm-' + mdlSeq + '" novalidate>' + o.fields.map(f => fieldHtml(f, vals[f.k])).join('') + '<div class="frm-live"></div><div class="frm-err" role="alert"></div><button type="submit" hidden></button></form>',
    foot: (o.danger ? '<button type="button" class="btn ghost danger" data-fdel>' + ic('trash', 'sm') + esc(o.danger.l) + '</button>' : '') + '<span class="sp"></span><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn pri" data-fok>' + esc(o.submit || 'Salvar') + '</button>',
    onClose: o.onClose,
  });
  const frm = $('form', m.el);
  const read = () => {
    const out = Object.assign({}, vals);
    for (const f of o.fields) {
      if (!f.k || f.t === 'sep' || f.t === 'html') continue;
      const el = frm.elements[f.k]; if (!el) continue;
      switch (f.t) {
        case 'money': case 'num': case 'pct': out[f.k] = el.value.trim() === '' ? (f.t === 'num' ? null : 0) : parseNum(el.value); break;
        case 'int': out[f.k] = el.value.trim() === '' ? null : Math.round(parseNum(el.value)); break;
        case 'check': out[f.k] = !!el.checked; break;
        case 'stars': out[f.k] = +(el.value || 0); break;
        default: out[f.k] = String(el.value ?? '').trim();
      }
    }
    return out;
  };

function pdvTotals() {
  const P = pdvState();
  const subtotal = r2(sum(P.items, i => i.qty * i.price));
  const raw = String(P.discount || '').trim();
  let discount = raw.endsWith('%') ? subtotal * parseNum(raw) / 100 : parseNum(raw);
  discount = r2(clamp(discount, 0, subtotal));
  const ship = P.delivery ? r2(P.ful.shippingCharged || 0) : 0;
  const total = r2(subtotal - discount + ship);
  const pm = ix().pm.get(P.pm);
  return { subtotal, discount, ship, total, fee: r2(total * (pm?.fee || 0) / 100), pm };
}

function pickCustomer(cb) {
  const list = S.customers.slice().sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  const row = c => { const cs = ix().custStats.get(c.id); return '<button type="button" class="step" data-pick="' + c.id + '"><span class="av">' + esc(initials(c.name)) + '</span><span>' + esc(c.name) + '<small class="muted">' + esc(c.phone || '') + (cs ? ' · ' + plural(cs.count, 'compra', 'compras') : '') + '</small></span></button>'; };
  const m = modal({ title: 'Identificar cliente', body: '<div class="row" style="margin-bottom:10px"><label class="search" style="max-width:none">' + ic('search', 'sm') + '<input type="search" id="pk-q" placeholder="Nome ou telefone" autofocus></label><button type="button" class="btn pri" id="pk-new">' + ic('plus', 'sm') + 'Novo</button></div><div class="steps" id="pk-list">' + list.slice(0, 40).map(row).join('') + '</div>' });
  const q = $('#pk-q', m.el);
  q.addEventListener('input', () => { const s = q.value.toLowerCase().trim(); const digits = s.replace(/\D/g, ''); $('#pk-list', m.el).innerHTML = list.filter(c => !s || c.name.toLowerCase().includes(s) || (digits && (c.phone || '').replace(/\D/g, '').includes(digits))).slice(0, 40).map(row).join('') || '<p class="muted">Nenhum cliente encontrado.</p>'; });
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) { m.close(); cb(b.dataset.pick); } });
  $('#pk-new', m.el).onclick = () => { const name = q.value.trim(); m.close(); customerForm(null, c => cb(c.id), /\d{6,}/.test(name) ? { phone: name } : { name }); };
}
ACT.pdvFinish = async () => {
  const P = pdvState(); const T = pdvTotals();
  if (!P.items.length) { toast('Adicione pelo menos um produto.', 'err'); return; }
  if (P.items.some(i => !(i.qty > 0))) { toast('Confira as quantidades.', 'err'); return; }
  const pm = T.pm;
  if (pm && pm.kind === 'prazo' && !P.customerId) { toast('Venda a prazo precisa de cliente identificado.', 'err'); return; }
  const rec = parseNum(P.received);
  if (pm && pm.kind === 'dinheiro' && rec > 0 && rec < T.total) { toast('O valor recebido é menor que o total.', 'err'); return; }
  const sale = saveSale({
    items: P.items, customerId: P.customerId, employeeId: P.employeeId, channelId: P.channelId, paymentMethodId: P.pm, discount: T.discount,
    dueDate: P.dueDate, date: P.date ? P.date.slice(0, 16) : '', notes: P.notes,
    fulfillment: P.delivery ? { type: P.ful.type, status: 'novo', promisedAt: P.ful.promisedAt, shippingCharged: P.ful.shippingCharged, shippingCost: P.ful.shippingCost, address: P.ful.address } : null,
  });
  LS.set('lastPm', P.pm); LS.set('lastEmp', P.employeeId);
  const change = pm && pm.kind === 'dinheiro' && rec > T.total ? rec - T.total : 0;
  UI.pdv = null; render();
  const m = modal({ title: 'Venda #' + sale.number + ' registrada', size: 'sm', body: '<div class="hero-v" style="font-size:2rem">' + fm(sale.total) + '</div><p class="ink2">' + esc(pmName(sale.paymentMethodId)) + ' · ' + plural(sum(sale.items, i => i.qty), 'item', 'itens') + (change ? ' · <b>Troco ' + fm(change) + '</b>' : '') + '</p>', foot: '<button type="button" class="btn" id="rc-copy">' + ic('copy', 'sm') + 'Copiar comprovante</button><span class="sp"></span><button type="button" class="btn pri" data-close autofocus>Nova venda</button>' });
  $('#rc-copy', m.el).onclick = () => copyText(receiptText(sale), 'Comprovante copiado');
  setTimeout(() => { const q = $('#pdv-q'); if (q && matchMedia('(pointer:fine)').matches && !$('.ovl')) q.focus(); }, 50);
};
function receiptText(s) {
  const cfg = S.config;
  return cfg.storeName + (cfg.doc ? '\nCNPJ/CPF ' + cfg.doc : '') + (cfg.phone ? '\n' + cfg.phone : '') + '\n------------------------------\nComprovante de venda #' + s.number + '\n' + fdt(s.date) + '\n' + (s.customerId ? 'Cliente: ' + custName(s.customerId) + '\n' : '') + '------------------------------\n' +
    s.items.map(i => i.qty + 'x ' + i.name + '  ' + fm(i.qty * i.price - (i.discount || 0))).join('\n') + '\n------------------------------\n' +
    (s.discount ? 'Desconto: −' + fm(s.discount) + '\n' : '') + (s.fulfillment?.shippingCharged ? 'Entrega: ' + fm(s.fulfillment.shippingCharged) + '\n' : '') + 'TOTAL: ' + fm(s.total) + '\nPagamento: ' + pmName(s.paymentMethodId) + '\n\nObrigado pela preferência!';
}

/* ---------- Caixa (abertura, sangria, suprimento, fechamento) ---------- */
function cashExpected(cs) {
  const cashSales = S.sales.filter(s => s.cashSessionId === cs.id && s.status !== 'cancelada');
  const sales = sum(cashSales, s => s.total);
  const sup = sum((cs.movements || []).filter(m => m.type === 'suprimento'), m => m.amount);
  const sang = sum((cs.movements || []).filter(m => m.type === 'sangria'), m => m.amount);
  return { sales, count: cashSales.length, sup, sang, expected: r2((cs.openingAmount || 0) + sales + sup - sang) };
}
function pgCaixa() {
  const cs = openCash();
  let h = pageHead('Dia a dia', 'Caixa', 'Abra o caixa com o troco do dia, registre sangrias e suprimentos e feche contando o dinheiro da gaveta. O sistema mostra a diferença.');
  if (!cs) {
    h += card('', '<div class="empty" style="padding:30px 10px">' + ic('lock') + '<b>O caixa está fechado</b><span>Informe o valor em dinheiro na gaveta para começar o dia.</span><button class="btn pri lg" data-act="cashOpen">Abrir caixa</button></div>');
  } else {
    const x = cashExpected(cs);
    h += '<section class="card"><div class="card-h"><h2>Caixa aberto</h2>' + chip('Aberto', 'good') + '<div class="sub">Aberto por ' + esc(cs.openedBy) + ' em ' + fdt(cs.openedAt) + '</div></div>' +
      kpis([
        { l: 'Abertura (troco)', v: fm(cs.openingAmount) },
        { l: 'Vendas em dinheiro', v: fm(x.sales), s: plural(x.count, 'venda', 'vendas') },
        { l: 'Suprimentos − sangrias', v: fm(x.sup - x.sang), s: 'Entraram ' + fm(x.sup) + ' · saíram ' + fm(x.sang) },
        { l: 'Esperado na gaveta', v: fm(x.expected), cls: 'hl', i: 'difcaixa' },
      ]) +
      '<div class="row" style="margin-top:14px"><button class="btn" data-act="cashMove" data-t="sangria">' + ic('upload', 'sm') + 'Sangria (retirar)</button><button class="btn" data-act="cashMove" data-t="suprimento">' + ic('download', 'sm') + 'Suprimento (colocar)</button><span class="sp"></span><button class="btn pri" data-act="cashClose">Fechar caixa</button></div>' +
      ((cs.movements || []).length ? '<div style="margin-top:14px">' + table('cashmv', { search: false, rows: cs.movements.slice().reverse(), cols: [{ k: 'at', l: 'Horário', f: m => fdt(m.at) }, { k: 't', l: 'Tipo', f: m => chip(m.type === 'sangria' ? 'Sangria' : 'Suprimento', m.type === 'sangria' ? 'warn' : 'info') }, { k: 'n', l: 'Motivo', f: m => esc(m.note || '—') }, { k: 'u', l: 'Usuário', f: m => esc(m.user || '') }, { k: 'v', l: 'Valor', num: 1, f: m => fm(m.amount) }] }) + '</div>' : '') + '</section>';
  }
  const closed = S.cash.filter(c => c.closedAt).sort((a, b) => (a.closedAt < b.closedAt ? 1 : -1));
  h += card('Fechamentos anteriores', table('cashhist', {
    rows: closed, act: 'cashView', ph: 'Buscar por operador ou data',
    empty: 'Nenhum caixa fechado ainda',
    text: c => c.openedBy + ' ' + c.closedBy + ' ' + fd(c.openedAt),
    cols: [
      { k: 'd', l: 'Data', f: c => '<b>' + fd(c.openedAt) + '</b><small class="muted">' + c.openedAt.slice(11, 16) + ' às ' + c.closedAt.slice(11, 16) + '</small>', s: c => c.openedAt },
      { k: 'op', l: 'Operador', f: c => esc(c.closedBy || c.openedBy), s: c => c.closedBy || '' },
      { k: 'e', l: 'Esperado', num: 1, f: c => fm(c.expectedAmount), s: c => c.expectedAmount },
      { k: 'c', l: 'Contado', num: 1, f: c => fm(c.countedAmount), s: c => c.countedAmount },
      { k: 'df', l: 'Diferença', num: 1, f: c => Math.abs(c.difference) < 0.005 ? chip('Sem diferença', 'good') : '<span class="' + moneyCls(c.difference) + '">' + (c.difference > 0 ? '+' : '') + fm(c.difference) + '</span>', s: c => c.difference },
    ],
  }), { i: 'difcaixa' });
  return h;
}
ACT.cashOpen = () => {
  if (openCash()) { go('caixa'); return; }
  const last = S.cash.filter(c => c.closedAt).sort((a, b) => (a.closedAt < b.closedAt ? 1 : -1))[0];
  openForm({
    title: 'Abrir caixa', submit: 'Abrir caixa', size: 'sm',
    fields: [{ k: 'amount', l: 'Dinheiro na gaveta (troco inicial)', t: 'money', req: 1, help: last ? 'No último fechamento foram contados ' + fm(last.countedAmount) + '.' : '' }],
    values: { amount: 0 },
    onSubmit: v => {
      const cs = { id: uid(), openedAt: nowS(), openedBy: CUR.name, openedById: CUR.id, openingAmount: r2(v.amount), movements: [] };
      S.cash.push(cs);
      commit('abriu', 'Caixa', 'Abertura de caixa com ' + fm(cs.openingAmount), cs.id);
      toast('Caixa aberto'); render();
    },
  });
};
ACT.cashMove = el => {
  const cs = openCash(); if (!cs) return;
  const t = el.dataset.t;
  openForm({
    title: t === 'sangria' ? 'Sangria — retirar dinheiro da gaveta' : 'Suprimento — colocar dinheiro na gaveta', size: 'sm',
    intro: t === 'sangria' ? 'Use para levar dinheiro ao cofre ou banco. Não é despesa: o dinheiro continua sendo da loja.' : 'Use para reforçar o troco.',
    fields: [{ k: 'amount', l: 'Valor', t: 'money', req: 1 }, { k: 'note', l: 'Motivo', ph: t === 'sangria' ? 'Ex.: depósito no banco' : 'Ex.: troco' }],
    onSubmit: v => {
      if (!(v.amount > 0)) return 'Informe um valor maior que zero.';
      cs.movements = cs.movements || [];
      cs.movements.push({ id: uid(), type: t, amount: r2(v.amount), note: v.note, at: nowS(), user: CUR.name });
      commit('registrou', 'Caixa', (t === 'sangria' ? 'Sangria de ' : 'Suprimento de ') + fm(v.amount) + (v.note ? ' — ' + v.note : ''), cs.id);
      toast(t === 'sangria' ? 'Sangria registrada' : 'Suprimento registrado'); render();
    },
  });
};
ACT.cashClose = () => {
  const cs = openCash(); if (!cs) return;
  const x = cashExpected(cs);
  openForm({
    title: 'Fechar caixa', submit: 'Fechar caixa',
    intro: 'Conte todo o dinheiro da gaveta e informe o valor. O esperado é <b>' + fm(x.expected) + '</b>.',
    fields: [{ k: 'counted', l: 'Dinheiro contado na gaveta', t: 'money', req: 1 }, { k: 'notes', l: 'Observação', t: 'textarea', ph: 'Explique a diferença, se houver' }],
    live: v => { const d = r2((v.counted || 0) - x.expected); return '<div class="preview"><div><span>Esperado</span><b>' + fm(x.expected) + '</b></div><div><span>Contado</span><b>' + fm(v.counted || 0) + '</b></div><div><span>Diferença</span><b class="' + moneyCls(d) + '">' + (d > 0 ? '+' : '') + fm(d) + '</b></div></div>' + (Math.abs(d) >= 0.01 ? '<p class="muted" style="margin-top:8px">' + (d < 0 ? 'Falta de caixa: o valor será lançado como quebra de caixa e contado nas perdas.' : 'Sobra de caixa: o valor será lançado como entrada.') + '</p>' : ''); },
    onSubmit: v => {
      const d = r2((v.counted || 0) - x.expected);
      cs.closedAt = nowS(); cs.closedBy = CUR.name; cs.closedById = CUR.id; cs.countedAmount = r2(v.counted || 0); cs.expectedAmount = x.expected; cs.difference = d; cs.notes = v.notes;
      if (Math.abs(d) >= 0.01) S.ledger.push({ id: uid(), type: d < 0 ? 'out' : 'in', date: today(), amount: Math.abs(d), categoryId: d < 0 ? 'quebra' : 'sobra', description: (d < 0 ? 'Falta' : 'Sobra') + ' no fechamento do caixa de ' + fd(cs.openedAt), status: 'pago', paidDate: today(), dueDate: today(), cashId: cs.id, createdAt: nowS() });
      commit('fechou', 'Caixa', 'Fechamento: esperado ' + fm(x.expected) + ', contado ' + fm(cs.countedAmount) + (Math.abs(d) >= 0.01 ? ', diferença ' + fm(d) : ', sem diferença'), cs.id);
      toast(Math.abs(d) < 0.01 ? 'Caixa fechado sem diferença' : 'Caixa fechado com diferença de ' + fm(d)); render();
    },
  });
};

function receivePurchase(p, date, silent) {
  p.receivedDate = date; p.status = 'recebido';
  const goods = sum(p.items, i => i.qty * i.unitCost);
  for (const it of p.items) {
    const prod = ix().prod.get(it.productId) || S.products.find(x => x.id === it.productId); if (!prod) continue;
    const freightShare = goods ? (p.freight || 0) * (it.qty * it.unitCost / goods) / it.qty : 0;
    const uc = r2(it.unitCost + freightShare);
    const old = Math.max(0, prod.stock || 0);
    prod.cost = r2(old + it.qty > 0 ? (old * (+prod.cost || 0) + it.qty * uc) / (old + it.qty) : uc);
    addMove(prod.id, +it.qty, 'compra', p.id, uc, 'Compra #' + p.number + ' — ' + supName(p.supplierId), date + (date.length === 10 ? 'T' + nowS().slice(11) : ''));
  }
  if (!silent) commit('recebeu', 'Compra', 'Compra #' + p.number + ' de ' + supName(p.supplierId) + ' — ' + fm(p.total), p.id);
}

function parseBackup(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { return null; }
  const st = o && o.app === 'caixa-claro' && o.state ? o.state : o;
  if (!st || !st.meta || !Array.isArray(st.sales) || !Array.isArray(st.products) || !st.config) return null;
  return st;
}
async function applyState(st, reason) {
  await snapshotBefore(reason);
  S = migrate(st); invalidate(); materializeRecurring(true);
  S.meta.rev = (S.meta.rev || 0) + 1;
  await flushSave();
  UI.pdv = null; UI.tbl = {}; UI.tabs = {}; UI.filters = {};
  const u = CUR && S.users.find(x => x.id === CUR.id && x.active !== false);
  if (u) CUR = u; else CUR = null;
  applyTheme();
  if (!CUR) { if (!needLogin()) CUR = S.users.find(x => x.active !== false) || null; }
  if (CUR) { logAudit(reason === 'restauração' ? 'restaurou' : 'iniciou', 'Sistema', reason === 'restauração' ? 'Backup restaurado' : reason); commit(null); enterApp(); } else showGate();
}
ACT.restore = () => {
  const m = modal({
    title: 'Restaurar backup',
    body: '<p class="ink2">Escolha o arquivo de backup (.json). Os dados atuais serão substituídos. Uma cópia de segurança dos dados atuais é guardada para você poder desfazer.</p><div class="fld" style="margin:14px 0"><label for="rs-f">Arquivo de backup</label><input type="file" id="rs-f" accept=".json,application/json,text/plain"></div><details><summary class="lb" style="cursor:pointer">Ou cole o conteúdo do backup</summary><textarea class="raw" id="rs-t" style="margin-top:8px" placeholder="Cole aqui o texto do backup"></textarea></details><div class="frm-err" id="rs-e" style="margin-top:10px"></div>',

  });

    const f = $('#rs-f', m.el).files[0];

  };
};

  const tb = (isAdmin() ? [['inicio', 'Início', 'home']] : [['vendas', 'Vendas', 'trend']]).concat([['modulos', 'Indicadores', 'grid'], ['vender', 'Vender', 'cart', 'sale'], ['caixa', 'Caixa', 'register']]);
  $('#root').innerHTML = '<div class="app" id="app"><aside class="side" id="side" aria-label="Menu principal"><div class="brand"><span class="brand-mark">' + esc(initials(cfg.appName)) + '</span><div class="brand-t"><b>' + esc(cfg.appName) + '</b><span>' + esc(cfg.storeName) + '</span></div></div>' +
    '<div class="who"><span class="av">' + esc(initials(CUR.name)) + '</span><div class="who-t"><b>' + esc(CUR.name) + '</b><span>' + (CUR.role === 'admin' ? 'Administrador' : 'Operador') + '</span></div><button class="icon-btn" data-act="logout" title="Trocar de usuário" aria-label="Trocar de usuário">' + ic('logout', 'sm') + '</button></div>' +
    '<nav class="nav">' + nav + '</nav><div class="side-foot" id="side-foot"></div></aside><div class="drawer-ovl" data-act="drawer"></div>' +
    '<div class="main"><header class="top"><button class="icon-btn menu-btn" data-act="drawer" aria-label="Abrir menu">' + ic('menu') + '</button><div class="top-t"><b id="top-title"></b></div><span id="top-per"></span><a class="btn pri hide-m" href="#vender" id="top-sale">' + ic('plus', 'sm') + 'Nova venda</a></header><main class="view" id="view" tabindex="-1"></main></div>' +
    '<nav class="tabbar" aria-label="Atalhos">' + tb.map(([r, l, i, c]) => '<a href="#' + r + '" data-tab="' + r + '" class="' + (c || '') + '">' + ic(i) + '<span>' + l + '</span></a>').join('') + '<button type="button" data-act="drawer">' + ic('menu') + '<span>Menu</span></button></nav></div>';
  updateFoot();
}
function updateFoot() {
  const el = document.getElementById('side-foot'); if (!el) return;
  el.innerHTML = saveOK ? '<span class="dot"></span><span>Dados salvos neste aparelho</span>' : '<span class="dot crit"></span><span>Falha ao salvar. Faça backup.</span>';
}
function banners() {
  let h = '';
  if (S.meta.demo && isAdmin() && ['inicio', 'modulos', 'config'].includes(UI.route)) h += '<div class="banner"><p><b>Loja de demonstração.</b> Os números são fictícios, para você conhecer o sistema. Quando quiser usar de verdade, comece com a sua loja.</p><button class="btn sm pri" data-act="startOwn">Começar com a minha loja</button></div>';
  if (!saveOK) h += '<div class="banner warn"><p>Este navegador não está permitindo salvar os dados. Não use aba anônima. Baixe um backup agora.</p><button class="btn sm" data-act="backupDl">Baixar backup</button></div>';
  return h;
}
function enterApp() {
  renderShell();
  render(true);
}
function render(scrollTop) {
  if (!CUR || !$('#view')) return;
  let r = UI.route;
  if (!ROUTES[r]) r = homeRoute();
  if (!canRoute(r)) r = homeRoute();
  UI.route = r;
  CH.clear(); TBL.clear(); hideTip();
  const R = ROUTES[r];
  const view = $('#view');
  try { view.innerHTML = banners() + R.r(); }
  catch (e) { console.error(e); view.innerHTML = banners() + card('', emptyBox('Não foi possível abrir esta tela', 'Erro: ' + esc(e.message || e) + '. Tente recarregar a página.', '<button class="btn" data-act="go" data-r="inicio">Voltar ao painel</button>')); }
  view.classList.toggle('has-bar', r === 'vender');
  for (const a of $$('[data-nav]')) a.classList.toggle('on', a.dataset.nav === r);
  for (const a of $$('[data-tab]')) a.classList.toggle('on', a.dataset.tab === r);
  $('#top-title').textContent = R.t;
  $('#top-sale').hidden = r === 'vender' || !canRoute('vender');
  const per = $('#top-per');
  if (R.p) { const pl = periodLabel(UI.period); per.innerHTML = '<button class="per-btn" data-act="period" aria-label="Mudar período">' + ic('cal', 'sm') + esc(pl.name) + ' <span class="hide-m">' + esc(pl.span) + '</span>' + ic('down', 'sm') + '</button>'; }
  else per.innerHTML = '';
  document.title = R.t + ' · ' + S.config.appName;
  drawCharts();
  if (r === 'vender') pdvRefresh(['tot']);
  if (scrollTop) window.scrollTo(0, 0);
}
function go(route, tab) {
  if (tab) UI.tabs[tab[0]] = tab[1];
  closeAllModals();
  if (location.hash.slice(1) === route) { UI.route = route; render(true); }
  else location.hash = route;
}

/* ---------- ações gerais ---------- */
ACT.info = el => showInfo(el.dataset.k);
ACT.period = () => openPeriod();
ACT.drawer = () => document.body.classList.toggle('drawer-open');
ACT.go = el => go(el.dataset.r, el.dataset.tg ? [el.dataset.tg, el.dataset.tv] : null);
ACT.tab = el => { UI.tabs[el.dataset.g] = el.dataset.v; render(); };
ACT.filt = el => { UI.filters[el.dataset.f] = el.dataset.v; render(); };
CHG.filt = el => { UI.filters[el.dataset.f] = el.value; render(); };
ACT.tsort = el => { const st = UI.tbl[el.dataset.t]; if (!st) return; if (st.sort === el.dataset.k) st.dir = -st.dir; else { st.sort = el.dataset.k; st.dir = -1; } refreshTable(el.dataset.t); };
ACT.tmore = el => { const st = UI.tbl[el.dataset.t]; if (!st) return; st.lim += 100; refreshTable(el.dataset.t); };
let tblTimer = null;
INP.tblq = el => { const st = UI.tbl[el.dataset.t]; if (!st) return; st.q = el.value; st.lim = Math.max(50, TBL.get(el.dataset.t)?.limit || 50); clearTimeout(tblTimer); tblTimer = setTimeout(() => refreshTable(el.dataset.t), 120); };

function applyTheme() {
  const t = S.config.theme;
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') { root.dataset.theme = t; root.dataset.ccTheme = '1'; }
  else if (root.dataset.ccTheme) { delete root.dataset.theme; delete root.dataset.ccTheme; }
}

function bindEvents() {
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a && !a.disabled) { const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); try { f(a, e); } catch (err) { console.error(err); toast('Algo deu errado: ' + (err.message || err), 'err'); } return; } }
    if (e.target.closest('.nav a, .tabbar a')) document.body.classList.remove('drawer-open');
  });
  document.addEventListener('input', e => { const a = e.target.closest('[data-inp]'); if (a && INP[a.dataset.inp]) INP[a.dataset.inp](a, e); });
  document.addEventListener('change', e => { const a = e.target.closest('[data-chg]'); if (a && CHG[a.dataset.chg]) CHG[a.dataset.chg](a, e); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('.ovl')) closeTopModal(); else document.body.classList.remove('drawer-open'); }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.click')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.id === 'pdv-q') {
      e.preventDefault();
      const q = e.target.value.trim().toLowerCase(); if (!q) return;
      const act = S.products.filter(p => p.active !== false);
      const exact = act.find(p => (p.sku || '').toLowerCase() === q);
      const first = exact || act.find(p => (p.name + ' ' + (p.sku || '')).toLowerCase().includes(q));
      if (first) { pdvAddProduct(first.id); e.target.value = ''; pdvState().q = ''; pdvRefresh(['res']); }
      else toast('Produto não encontrado', 'err');
    }
  });
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('.chart'); if (el && el.id) chartHover(el, e.clientX, e.clientY); else if (!$('#tip').hidden) hideTip(); }, { passive: true });
  document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('.chart'); if (el && el.id) chartHover(el, e.clientX, e.clientY); else hideTip(); }, { passive: true });
  window.addEventListener('scroll', () => { if (!$('#tip').hidden) hideTip(); }, { passive: true });
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== UI.route) { UI.route = r; closeAllModals(); document.body.classList.remove('drawer-open'); render(true); } });
  let rz = null, lastW = innerWidth;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(innerWidth - lastW) > 4) { lastW = innerWidth; drawCharts(); } }, 150); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flushSave(); });
  window.addEventListener('pagehide', () => { if (saveTimer) flushSave(); });
}
function setupSync() {
  try {
    BC = new BroadcastChannel('caixa-claro');
    BC.onmessage = async ev => {
      if (!ev.data || ev.data.tab === TAB_ID || !(ev.data.rev > S.meta.rev)) return;
      const st = await Store.get('state'); if (!st || !st.meta) return;
      S = migrate(st); invalidate();
      if (CUR) { CUR = S.users.find(u => u.id === CUR.id) || CUR; if ($('.ovl')) return; render(); toast('Atualizado com as alterações feitas em outra janela'); }
    };
  } catch (e) { /* navegador sem BroadcastChannel */ }
}
function setupPWA() {
  try {
    if (!/^https?:$/.test(location.protocol) || window.top !== window.self) return;
    if (/claude|anthropic/i.test(location.hostname)) return;
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* sem modo offline */ });
  } catch (e) { /* ok */ }
}

async function boot() {
  await Store.open();
  let st = null;
  try { st = await Store.get('state'); } catch (e) { st = null; }
  if (st && st.meta && Array.isArray(st.sales)) S = migrate(st);
  else { S = buildDemo(); S.meta.demo = true; LS.set('lastUser', S.users[0].id); await flushSave(); }
  materializeRecurring(true);
  invalidate();
  applyTheme();
  UI.period = LS.get('period', { id: 'mes' }) || { id: 'mes' };
  if (UI.period.id === 'custom' && !(UI.period.from && UI.period.to)) UI.period = { id: 'mes' };
  UI.route = location.hash.slice(1) || 'inicio';
  bindEvents(); setupSync(); setupPWA();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { /* ok */ }
  const act = activeUsers();
  let sid = null; try { sid = sessionStorage.getItem('cc_uid'); } catch (e) { /* ok */ }
  const bySession = act.find(u => u.id === sid);
  const last = act.find(u => u.id === LS.get('lastUser', ''));
  if (!needLogin()) CUR = act[0] || S.users[0];
  else if (bySession) CUR = bySession;
  else if (last && !last.pin) CUR = last;
  if (CUR) enterApp(); else showGate();
}
boot().catch(e => { console.error(e); const r = document.getElementById('root'); if (r) r.innerHTML = '<div class="gate"><div class="gate-box"><h1>Não foi possível abrir</h1><p>' + esc(e.message || e) + '</p><p class="muted">Use o Google Chrome ou o Microsoft Edge atualizados e não use aba anônima.</p></div></div>'; });
</script>
</body></html>
